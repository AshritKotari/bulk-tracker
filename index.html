<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Bulk Tracker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f3f4f6;
    color: #111827;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 18px;
}

.header {
    background: #111827;
    color: white;
    padding: 22px;
    border-radius: 20px;
    margin-bottom: 16px;
}

.header h1 {
    margin: 0;
    font-size: 27px;
}

.header p {
    margin: 6px 0 0;
    color: #d1d5db;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.date-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    margin-top: 6px;
}

label {
    font-size: 13px;
    font-weight: 600;
    color: #4b5563;
}

.target-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.stat {
    background: #f9fafb;
    padding: 14px;
    border-radius: 14px;
}

.stat-title {
    font-size: 13px;
    color: #6b7280;
}

.stat-value {
    font-size: 24px;
    font-weight: 700;
    margin-top: 3px;
}

.progress {
    height: 10px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 8px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #111827;
    border-radius: 20px;
    transition: width 0.3s;
}

.remaining {
    font-size: 13px;
    color: #6b7280;
    margin-top: 5px;
}

button {
    border: none;
    border-radius: 11px;
    padding: 12px 15px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

.primary {
    background: #111827;
    color: white;
}

.secondary {
    background: #e5e7eb;
    color: #111827;
}

.danger {
    background: #fee2e2;
    color: #b91c1c;
}

.add-button {
    width: 100%;
    margin-top: 12px;
}

.meal {
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 14px;
    margin-top: 12px;
}

.meal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.meal-name {
    font-weight: 700;
    font-size: 17px;
}

.food {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
}

.food:last-child {
    border-bottom: none;
}

.food-info {
    flex: 1;
}

.food-title {
    font-weight: 600;
}

.food-details {
    font-size: 13px;
    color: #6b7280;
    margin-top: 3px;
}

.delete-btn {
    background: transparent;
    color: #ef4444;
    padding: 5px 8px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.full {
    grid-column: 1 / -1;
}

.button-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.button-row button {
    flex: 1;
}

.empty {
    text-align: center;
    color: #6b7280;
    padding: 15px;
}

.small {
    font-size: 12px;
    color: #6b7280;
}

.weight-history {
    margin-top: 10px;
}

.weight-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}

@media (max-width: 400px) {
    .target-grid,
    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>💪 Bulk Tracker</h1>
        <p>Track your calories, protein and progress</p>
    </div>

    <!-- DATE -->
    <div class="card">
        <div class="date-row">
            <div>
                <label>TRACKING DATE</label>
                <input type="date" id="datePicker">
            </div>
        </div>
    </div>

    <!-- TARGETS -->
    <div class="card">
        <h2>🎯 Daily Targets</h2>

        <div class="target-grid">
            <div>
                <label>Calories Target</label>
                <input type="number" id="calorieTarget" placeholder="e.g. 2800">
            </div>

            <div>
                <label>Protein Target (g)</label>
                <input type="number" id="proteinTarget" placeholder="e.g. 130">
            </div>
        </div>

        <button class="primary add-button" onclick="saveTargets()">
            Save Targets
        </button>
    </div>

    <!-- PROGRESS -->
    <div class="card">
        <h2>📊 Today's Progress</h2>

        <div class="stat">
            <div class="stat-title">Calories</div>
            <div class="stat-value">
                <span id="totalCalories">0</span>
                <span class="small">kcal</span>
            </div>

            <div class="progress">
                <div class="progress-bar" id="calorieProgress"></div>
            </div>

            <div class="remaining" id="calorieRemaining">
                Set your calorie target
            </div>
        </div>

        <br>

        <div class="stat">
            <div class="stat-title">Protein</div>
            <div class="stat-value">
                <span id="totalProtein">0</span>
                <span class="small">g</span>
            </div>

            <div class="progress">
                <div class="progress-bar" id="proteinProgress"></div>
            </div>

            <div class="remaining" id="proteinRemaining">
                Set your protein target
            </div>
        </div>
    </div>

    <!-- ADD FOOD -->
    <div class="card">
        <h2>🍽️ Add Food</h2>

        <div class="form-grid">

            <div class="full">
                <label>Meal</label>
                <select id="mealType">
                    <option>Breakfast</option>
                    <option>Lunch</option>
                    <option>Snacks</option>
                    <option>Dinner</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="full">
                <label>Food Name</label>
                <input type="text" id="foodName" placeholder="e.g. Chicken breast">
            </div>

            <div>
                <label>Calories</label>
                <input type="number" id="foodCalories" placeholder="Calories">
            </div>

            <div>
                <label>Protein (g)</label>
                <input type="number" id="foodProtein" placeholder="Protein">
            </div>

        </div>

        <button class="primary add-button" onclick="addFood()">
            + Add Food
        </button>
    </div>

    <!-- MEALS -->
    <div class="card">
        <h2>🥗 Today's Meals</h2>
        <div id="mealList"></div>
    </div>

    <!-- WEIGHT -->
    <div class="card">
        <h2>⚖️ Weight Tracking</h2>

        <label>Today's Weight (kg)</label>
        <input type="number" id="weightInput" step="0.1" placeholder="Enter weight">

        <button class="primary add-button" onclick="saveWeight()">
            Save Weight
        </button>

        <div class="weight-history" id="weightHistory"></div>
    </div>

    <!-- RESET -->
    <div class="card">
        <button class="danger add-button" onclick="resetDay()">
            🗑️ Reset Today's Food
        </button>
    </div>

</div>

<script>

let currentDate = "";
let data = {};

const datePicker = document.getElementById("datePicker");

function todayString() {
    const d = new Date();
    const offset = d.getTimezoneOffset();
    const local = new Date(d.getTime() - offset * 60000);
    return local.toISOString().split("T")[0];
}

function loadData() {
    const saved = localStorage.getItem("bulkTrackerData");

    if (saved) {
        data = JSON.parse(saved);
    }

    currentDate = datePicker.value;

    if (!data[currentDate]) {
        data[currentDate] = {
            foods: [],
            weight: ""
        };
    }

    const savedTargets = localStorage.getItem("bulkTargets");

    if (savedTargets) {
        const targets = JSON.parse(savedTargets);

        document.getElementById("calorieTarget").value =
            targets.calories || "";

        document.getElementById("proteinTarget").value =
            targets.protein || "";
    }

    render();
}

function saveAll() {
    localStorage.setItem(
        "bulkTrackerData",
        JSON.stringify(data)
    );
}

function saveTargets() {

    const calories =
        Number(document.getElementById("calorieTarget").value);

    const protein =
        Number(document.getElementById("proteinTarget").value);

    localStorage.setItem(
        "bulkTargets",
        JSON.stringify({
            calories: calories,
            protein: protein
        })
    );

    updateProgress();

    alert("Targets saved!");
}

function addFood() {

    const meal =
        document.getElementById("mealType").value;

    const name =
        document.getElementById("foodName").value.trim();

    const calories =
        Number(document.getElementById("foodCalories").value);

    const protein =
        Number(document.getElementById("foodProtein").value);

    if (!name) {
        alert("Please enter the food name.");
        return;
    }

    if (calories < 0 || protein < 0) {
        alert("Calories and protein cannot be negative.");
        return;
    }

    data[currentDate].foods.push({
        id: Date.now(),
        meal: meal,
        name: name,
        calories: calories,
        protein: protein
    });

    saveAll();

    document.getElementById("foodName").value = "";
    document.getElementById("foodCalories").value = "";
    document.getElementById("foodProtein").value = "";

    render();
}

function deleteFood(id) {

    data[currentDate].foods =
        data[currentDate].foods.filter(food => food.id !== id);

    saveAll();
    render();
}

function render() {

    const list =
        document.getElementById("mealList");

    const foods =
        data[currentDate].foods || [];

    if (foods.length === 0) {

        list.innerHTML =
            `<div class="empty">
                No foods added today.<br>
                Add your first meal above.
            </div>`;

        updateProgress();
        renderWeight();
        return;
    }

    const meals = [
        "Breakfast",
        "Lunch",
        "Snacks",
        "Dinner",
        "Other"
    ];

    let html = "";

    meals.forEach(meal => {

        const mealFoods =
            foods.filter(food => food.meal === meal);

        if (mealFoods.length === 0) return;

        let mealCalories = 0;
        let mealProtein = 0;

        mealFoods.forEach(food => {
            mealCalories += Number(food.calories);
            mealProtein += Number(food.protein);
        });

        html += `
        <div class="meal">

            <div class="meal-header">
                <div class="meal-name">${meal}</div>

                <div class="small">
                    ${mealCalories} kcal •
                    ${mealProtein}g protein
                </div>
            </div>
        `;

        mealFoods.forEach(food => {

            html += `
            <div class="food">

                <div class="food-info">

                    <div class="food-title">
                        ${escapeHTML(food.name)}
                    </div>

                    <div class="food-details">
                        ${food.calories} kcal •
                        ${food.protein}g protein
                    </div>

                </div>

                <button
                    class="delete-btn"
                    onclick="deleteFood(${food.id})">
                    ✕
                </button>

            </div>
            `;
        });

        html += `</div>`;
    });

    list.innerHTML = html;

    updateProgress();
    renderWeight();
}

function updateProgress() {

    const foods =
        data[currentDate].foods || [];

    let calories = 0;
    let protein = 0;

    foods.forEach(food => {
        calories += Number(food.calories);
        protein += Number(food.protein);
    });

    document.getElementById("totalCalories")
        .textContent = calories;

    document.getElementById("totalProtein")
        .textContent = protein;

    const calorieTarget =
        Number(document.getElementById("calorieTarget").value);

    const proteinTarget =
        Number(document.getElementById("proteinTarget").value);

    if (calorieTarget > 0) {

        const percentage =
            Math.min((calories / calorieTarget) * 100, 100);

        document.getElementById("calorieProgress")
            .style.width = percentage + "%";

        const remaining =
            calorieTarget - calories;

        document.getElementById("calorieRemaining")
            .textContent =
            remaining > 0
            ? `${remaining} kcal remaining`
            : `${Math.abs(remaining)} kcal over target`;
    }

    if (proteinTarget > 0) {

        const percentage =
            Math.min((protein / proteinTarget) * 100, 100);

        document.getElementById("proteinProgress")
            .style.width = percentage + "%";

        const remaining =
            proteinTarget - protein;

        document.getElementById("proteinRemaining")
            .textContent =
            remaining > 0
            ? `${remaining}g protein remaining`
            : `${Math.abs(remaining)}g over target`;
    }
}

function saveWeight() {

    const weight =
        document.getElementById("weightInput").value;

    if (!weight) {
        alert("Please enter your weight.");
        return;
    }

    data[currentDate].weight = Number(weight);

    saveAll();
    renderWeight();

    alert("Weight saved!");
}

function renderWeight() {

    const history =
        document.getElementById("weightHistory");

    const entries = Object.keys(data)
        .filter(date => data[date].weight)
        .sort()
        .reverse();

    if (entries.length === 0) {

        history.innerHTML =
            `<div class="empty">
                No weight records yet.
            </div>`;

        return;
    }

    history.innerHTML = entries
        .slice(0, 7)
        .map(date => `
            <div class="weight-item">
                <span>${date}</span>
                <strong>${data[date].weight} kg</strong>
            </div>
        `)
        .join("");

    document.getElementById("weightInput").value =
        data[currentDate].weight || "";
}

function resetDay() {

    const confirmReset =
        confirm("Delete all food entries for this day?");

    if (!confirmReset) return;

    data[currentDate].foods = [];

    saveAll();
    render();
}

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

datePicker.addEventListener("change", function() {

    currentDate = this.value;

    if (!data[currentDate]) {
        data[currentDate] = {
            foods: [],
            weight: ""
        };
    }

    saveAll();
    render();
});

datePicker.value = todayString();

loadData();

</script>

</body>
</html>
