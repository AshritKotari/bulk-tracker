<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>BulkUp Tracker</title>
<style>
:root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --line:#e5e7eb;
    --primary:#7c3aed;
    --primary-light:#ede9fe;
    --orange:#f97316;
    --green:#10b981;
    --red:#ef4444;
    --shadow:0 8px 30px rgba(15,23,42,.07);
}
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}
.app{
    max-width:600px;
    margin:auto;
    padding:18px 16px 100px;
}
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}
.logo{
    font-size:25px;
    font-weight:800;
    letter-spacing:-.7px;
}
.logo span{
    color:var(--primary);
}
.date{
    color:var(--muted);
    font-size:13px;
    margin-top:3px;
}
.icon-btn{
    width:44px;
    height:44px;
    border:0;
    border-radius:14px;
    background:var(--card);
    box-shadow:var(--shadow);
    font-size:20px;
}
.hero{
    background:linear-gradient(135deg,#6d28d9,#8b5cf6);
    color:white;
    border-radius:26px;
    padding:22px;
    box-shadow:0 12px 30px rgba(124,58,237,.25);
    margin-bottom:16px;
}
.hero-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.hero h2{
    margin:0;
    font-size:20px;
}
.hero p{
    margin:5px 0 0;
    opacity:.8;
    font-size:13px;
}
.fire{
    font-size:28px;
}
.hero-number{
    font-size:38px;
    font-weight:800;
    margin-top:20px;
    letter-spacing:-1px;
}
.hero-number small{
    font-size:16px;
    font-weight:500;
    opacity:.8;
}
.progress{
    height:9px;
    background:rgba(255,255,255,.25);
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}
.progress-fill{
    height:100%;
    width:0;
    background:white;
    border-radius:20px;
    transition:.4s;
}
.hero-bottom{
    display:flex;
    justify-content:space-between;
    margin-top:9px;
    font-size:12px;
    opacity:.85;
}
.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:16px;
}
.stat-card{
    background:var(--card);
    border-radius:20px;
    padding:17px;
    box-shadow:var(--shadow);
}
.stat-icon{
    font-size:22px;
}
.stat-title{
    color:var(--muted);
    font-size:12px;
    margin-top:8px;
}
.stat-number{
    font-size:25px;
    font-weight:800;
    margin-top:3px;
}
.stat-number small{
    font-size:12px;
    color:var(--muted);
    font-weight:500;
}
.section{
    margin-top:20px;
}
.section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}
.section-head h3{
    margin:0;
    font-size:18px;
}
.section-head button{
    border:0;
    background:none;
    color:var(--primary);
    font-weight:700;
}
.meal-card{
    background:var(--card);
    border-radius:20px;
    padding:15px;
    margin-bottom:11px;
    box-shadow:var(--shadow);
}
.meal-head{
    display:flex;
    align-items:center;
    gap:12px;
}
.meal-icon{
    width:43px;
    height:43px;
    display:grid;
    place-items:center;
    background:var(--primary-light);
    border-radius:13px;
    font-size:21px;
}
.meal-info{
    flex:1;
}
.meal-name{
    font-weight:750;
}
.meal-total{
    font-size:12px;
    color:var(--muted);
    margin-top:3px;
}
.add-meal{
    border:0;
    background:#f3f4f6;
    width:36px;
    height:36px;
    border-radius:12px;
    font-size:22px;
}
.food-row{
    display:flex;
    align-items:center;
    padding:12px 0 2px 55px;
    border-bottom:1px solid var(--line);
}
.food-row:last-child{
    border-bottom:0;
}
.food-info{
    flex:1;
}
.food-name{
    font-weight:600;
    font-size:14px;
}
.food-meta{
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
}
.delete{
    border:0;
    background:none;
    color:#ef4444;
    font-size:17px;
    padding:8px;
}
.quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}
.quick-food{
    border:0;
    background:var(--card);
    border-radius:17px;
    padding:14px;
    text-align:left;
    box-shadow:var(--shadow);
}
.quick-food:active{
    transform:scale(.97);
}
.quick-food b{
    display:block;
    margin-top:7px;
}
.quick-food span{
    color:var(--muted);
    font-size:11px;
}
.form-card{
    background:var(--card);
    border-radius:22px;
    padding:18px;
    box-shadow:var(--shadow);
}
label{
    display:block;
    color:var(--muted);
    font-size:12px;
    font-weight:650;
    margin-bottom:5px;
}
input,select{
    width:100%;
    border:1px solid var(--line);
    background:#fafafa;
    color:var(--text);
    padding:13px;
    border-radius:13px;
    font-size:15px;
    outline:none;
}
input:focus,select:focus{
    border-color:var(--primary);
}
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:11px;
}
.full{
    grid-column:1/-1;
}
.primary-btn{
    width:100%;
    border:0;
    background:var(--primary);
    color:white;
    padding:14px;
    border-radius:14px;
    font-size:15px;
    font-weight:750;
    margin-top:12px;
}
.weight-card{
    background:var(--card);
    border-radius:22px;
    padding:18px;
    box-shadow:var(--shadow);
}
.weight-main{
    display:flex;
    align-items:center;
    justify-content:space-between;
}
.weight-number{
    font-size:32px;
    font-weight:800;
}
.weight-number small{
    font-size:13px;
    color:var(--muted);
}
.weight-history{
    margin-top:15px;
}
.weight-line{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
}
.empty{
    color:var(--muted);
    text-align:center;
    padding:20px 10px;
    font-size:13px;
}
.settings{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    z-index:10;
    align-items:flex-end;
}
.settings.open{
    display:flex;
}
.sheet{
    width:100%;
    max-width:600px;
    margin:auto;
    background:var(--card);
    border-radius:25px 25px 0 0;
    padding:22px;
}
.sheet h2{
    margin-top:0;
}
.close{
    float:right;
    border:0;
    background:#f3f4f6;
    width:36px;
    height:36px;
    border-radius:50%;
}
.toast{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%) translateY(100px);
    background:#111827;
    color:white;
    padding:12px 18px;
    border-radius:14px;
    font-size:13px;
    opacity:0;
    transition:.3s;
    z-index:20;
}
.toast.show{
    transform:translateX(-50%) translateY(0);
    opacity:1;
}
@media(max-width:380px){
    .stats{
        grid-template-columns:1fr;
    }
    .form-grid{
        grid-template-columns:1fr;
    }
    .full{
        grid-column:auto;
    }
}
@media(prefers-color-scheme:dark){
    :root{
        --bg:#0b1120;
        --card:#111827;
        --text:#f9fafb;
        --muted:#9ca3af;
        --line:#273244;
        --primary-light:#2e1065;
    }
    input,select,
    .add-meal,
    .close{
        background:#182235;
        color:var(--text);
    }
}
</style>
</head>
<body>
<div class="app">
    <div class="topbar">
        <div>
            <div class="logo">Bulk<span>Up</span> 💪</div>
            <div class="date" id="todayText"></div>
        </div>
        <button class="icon-btn" onclick="openSettings()">⚙️</button>
    </div>
    <!-- CALORIE HERO -->
    <div class="hero">
        <div class="hero-top">
            <div>
                <h2>Daily Calories</h2>
                <p>Keep moving toward your bulk goal</p>
            </div>
            <div class="fire">🔥</div>
        </div>
        <div class="hero-number">
            <span id="calories">0</span>
            <small>/ <span id="calorieTargetDisplay">2800</span> kcal</small>
        </div>
        <div class="progress">
            <div class="progress-fill" id="calorieBar"></div>
        </div>
        <div class="hero-bottom">
            <span id="caloriePercent">0% completed</span>
            <span id="calorieLeft">2800 kcal left</span>
        </div>
    </div>
    <!-- QUICK STATS -->
    <div class="stats">
        <div class="stat-card">
            <div class="stat-icon">💪</div>
            <div class="stat-title">PROTEIN</div>
            <div class="stat-number">
                <span id="protein">0</span>
                <small>g</small>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">⚖️</div>
            <div class="stat-title">WEIGHT</div>
            <div class="stat-number">
                <span id="currentWeight">--</span>
                <small>kg</small>
            </div>
        </div>
    </div>
    <!-- QUICK FOODS -->
    <div class="section">
        <div class="section-head">
            <h3>⚡ Quick Add</h3>
        </div>
        <div class="quick-grid">
            <button class="quick-food" onclick="quickAdd('Eggs',78,6,'Breakfast')">
                🥚
                <b>1 Egg</b>
                <span>78 kcal • 6g protein</span>
            </button>
            <button class="quick-food" onclick="quickAdd('Banana',105,1.3,'Breakfast')">
                🍌
                <b>1 Banana</b>
                <span>105 kcal • 1.3g protein</span>
            </button>
            <button class="quick-food" onclick="quickAdd('Chicken Breast',165,31,'Lunch')">
                🍗
                <b>Chicken</b>
                <span>165 kcal • 31g protein</span>
            </button>
            <button class="quick-food" onclick="quickAdd('Milk',122,6.3,'Snacks')">
                🥛
                <b>Milk</b>
                <span>122 kcal • 6.3g protein</span>
            </button>
        </div>
    </div>
    <!-- MEALS -->
    <div class="section">
        <div class="section-head">
            <h3>🍽️ Today's Meals</h3>
            <button onclick="scrollToAdd()">+ Add food</button>
        </div>
        <div id="meals"></div>
    </div>
    <!-- ADD FOOD -->
    <div class="section" id="addSection">
        <div class="section-head">
            <h3>➕ Add Food</h3>
        </div>
        <div class="form-card">
            <div class="form-grid">
                <div class="full">
                    <label>FOOD NAME</label>
                    <input id="foodName" placeholder="e.g. Paneer">
                </div>
                <div>
                    <label>CALORIES</label>
                    <input id="foodCalories" type="number" placeholder="kcal">
                </div>
                <div>
                    <label>PROTEIN</label>
                    <input id="foodProtein" type="number" step="0.1" placeholder="grams">
                </div>
                <div class="full">
                    <label>MEAL</label>
                    <select id="mealType">
                        <option>Breakfast</option>
                        <option>Lunch</option>
                        <option>Snacks</option>
                        <option>Dinner</option>
                    </select>
                </div>
            </div>
            <button class="primary-btn" onclick="addFood()">
                Add to Today's Meals
            </button>
        </div>
    </div>
    <!-- WEIGHT -->
    <div class="section">
        <div class="section-head">
            <h3>⚖️ Weight</h3>
        </div>
        <div class="weight-card">
            <div class="weight-main">
                <div>
                    <div class="stat-title">TODAY'S WEIGHT</div>
                    <div class="weight-number">
                        <span id="weightBig">--</span>
                        <small>kg</small>
                    </div>
                </div>
                <div style="width:130px">
                    <input id="weightInput" type="number" step="0.1" placeholder="Weight">
                    <button class="primary-btn" onclick="saveWeight()">Save</button>
                </div>
            </div>
            <div class="weight-history" id="weightHistory"></div>
        </div>
    </div>
</div>
<!-- SETTINGS -->
<div class="settings" id="settings">
    <div class="sheet">
        <button class="close" onclick="closeSettings()">✕</button>
        <h2>⚙️ Goals</h2>
        <label>DAILY CALORIE TARGET</label>
        <input id="settingsCalories" type="number">
        <br><br>
        <label>DAILY PROTEIN TARGET</label>
        <input id="settingsProtein" type="number">
        <button class="primary-btn" onclick="saveGoals()">
            Save Goals
        </button>
        <button
            class="primary-btn"
            style="background:#fee2e2;color:#b91c1c"
            onclick="clearAllData()">
            Reset All Data
        </button>
    </div>
</div>
<div class="toast" id="toast"></div>
<script>
const KEY = "bulkupTrackerV2";
let appData = JSON.parse(localStorage.getItem(KEY)) || {
    goals:{
        calories:2800,
        protein:130
    },
    days:{}
};
let selectedDate = today();
function today(){
    const d = new Date();
    return d.toISOString().split("T")[0];
}
function getDay(){
    if(!appData.days[selectedDate]){
        appData.days[selectedDate] = {
            foods:[],
            weight:null
        };
    }
    return appData.days[selectedDate];
}
function save(){
    localStorage.setItem(KEY,JSON.stringify(appData));
}
function showToast(message){
    const toast=document.getElementById("toast");
    toast.textContent=message;
    toast.classList.add("show");
    setTimeout(()=>{
        toast.classList.remove("show");
    },1800);
}
function addFood(){
    const name=document.getElementById("foodName").value.trim();
    const calories=Number(document.getElementById("foodCalories").value);
    const protein=Number(document.getElementById("foodProtein").value);
    const meal=document.getElementById("mealType").value;
    if(!name){
        showToast("Enter a food name");
        return;
    }
    if(calories<0 || protein<0){
        showToast("Enter valid values");
        return;
    }
    getDay().foods.push({
        id:Date.now(),
        name,
        calories,
        protein,
        meal
    });
    save();
    document.getElementById("foodName").value="";
    document.getElementById("foodCalories").value="";
    document.getElementById("foodProtein").value="";
    render();
    showToast("Food added ✓");
}
function quickAdd(name,calories,protein,meal){
    getDay().foods.push({
        id:Date.now(),
        name,
        calories,
        protein,
        meal
    });
    save();
    render();
    showToast(name+" added ✓");
}
function deleteFood(id){
    getDay().foods =
        getDay().foods.filter(food=>food.id!==id);
    save();
    render();
    showToast("Food removed");
}
function render(){
    const day=getDay();
    let calories=0;
    let protein=0;
    day.foods.forEach(food=>{
        calories+=Number(food.calories);
        protein+=Number(food.protein);
    });
    document.getElementById("calories").textContent=Math.round(calories);
    document.getElementById("protein").textContent=Math.round(protein*10)/10;
    const target=Number(appData.goals.calories)||2800;
    const proteinTarget=Number(appData.goals.protein)||130;
    document.getElementById("calorieTargetDisplay").textContent=target;
    const percent=Math.min((calories/target)*100,100);
    document.getElementById("calorieBar").style.width=percent+"%";
    document.getElementById("caloriePercent").textContent=
        Math.round(percent)+"% completed";
    const left=target-calories;
    document.getElementById("calorieLeft").textContent=
        left>=0
        ? Math.round(left)+" kcal left"
        : Math.round(Math.abs(left))+" kcal over";
    renderMeals();
    renderWeight();
}
function renderMeals(){
    const meals=[
        ["Breakfast","🍳"],
        ["Lunch","🍛"],
        ["Snacks","🥜"],
        ["Dinner","🍽️"]
    ];
    const foods=getDay().foods;
    let html="";
    meals.forEach(([meal,icon])=>{
        const list=foods.filter(f=>f.meal===meal);
        let totalCal=0;
        let totalProtein=0;
        list.forEach(f=>{
            totalCal+=Number(f.calories);
            totalProtein+=Number(f.protein);
        });
        html+=`
        <div class="meal-card">
            <div class="meal-head">
                <div class="meal-icon">${icon}</div>
                <div class="meal-info">
                    <div class="meal-name">${meal}</div>
                    <div class="meal-total">
                        ${totalCal} kcal • ${Math.round(totalProtein*10)/10}g protein
                    </div>
                </div>
                <button class="add-meal"
                    onclick="selectMeal('${meal}')">
                    +
                </button>
            </div>
        `;
        list.forEach(food=>{
            html+=`
            <div class="food-row">
                <div class="food-info">
                    <div class="food-name">${escapeHTML(food.name)}</div>
                    <div class="food-meta">
                        ${food.calories} kcal • ${food.protein}g protein
                    </div>
                </div>
                <button
                    class="delete"
                    onclick="deleteFood(${food.id})">
                    ✕
                </button>
            </div>
            `;
        });
        if(list.length===0){
            html+=`
            <div class="empty">
                Nothing added yet
            </div>
            `;
        }
        html+=`</div>`;
    });
    document.getElementById("meals").innerHTML=html;
}
function selectMeal(meal){
    document.getElementById("mealType").value=meal;
    scrollToAdd();
    setTimeout(()=>{
        document.getElementById("foodName").focus();
    },400);
}
function scrollToAdd(){
    document.getElementById("addSection")
        .scrollIntoView({
            behavior:"smooth",
            block:"center"
        });
}
function saveWeight(){
    const value=Number(
        document.getElementById("weightInput").value
    );
    if(!value){
        showToast("Enter your weight");
        return;
    }
    getDay().weight=value;
    save();
    renderWeight();
    showToast("Weight saved ✓");
}
function renderWeight(){
    const day=getDay();
    document.getElementById("currentWeight").textContent=
        day.weight || "--";
    document.getElementById("weightBig").textContent=
        day.weight || "--";
    document.getElementById("weightInput").value=
        day.weight || "";
    const dates=Object.keys(appData.days)
        .filter(date=>appData.days[date].weight)
        .sort()
        .reverse()
        .slice(0,7);
    let html="";
    dates.forEach(date=>{
        html+=`
        <div class="weight-line">
            <span>${formatDate(date)}</span>
            <strong>${appData.days[date].weight} kg</strong>
        </div>
        `;
    });
    document.getElementById("weightHistory").innerHTML=html;
}
function formatDate(date){
    const d=new Date(date+"T00:00:00");
    return d.toLocaleDateString("en-IN",{
        day:"numeric",
        month:"short"
    });
}
function openSettings(){
    document.getElementById("settingsCalories").value=
        appData.goals.calories;
    document.getElementById("settingsProtein").value=
        appData.goals.protein;
    document.getElementById("settings")
        .classList.add("open");
}
function closeSettings(){
    document.getElementById("settings")
        .classList.remove("open");
}
function saveGoals(){
    const calories=Number(
        document.getElementById("settingsCalories").value
    );
    const protein=Number(
        document.getElementById("settingsProtein").value
    );
    if(calories<=0 || protein<=0){
        showToast("Enter valid goals");
        return;
    }
    appData.goals.calories=calories;
    appData.goals.protein=protein;
    save();
    render();
    closeSettings();
    showToast("Goals updated ✓");
}
function clearAllData(){
    if(!confirm("Delete all tracker data?")){
        return;
    }
    localStorage.removeItem(KEY);
    appData={
        goals:{
            calories:2800,
            protein:130
        },
        days:{}
    };
    closeSettings();
    render();
    showToast("All data cleared");
}
function escapeHTML(text){
    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
document.getElementById("todayText").textContent =
    new Date().toLocaleDateString("en-IN",{
        weekday:"long",
        day:"numeric",
        month:"long"
    });
render();
</script>
</body>
</html>
